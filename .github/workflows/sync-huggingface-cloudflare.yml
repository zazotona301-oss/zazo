name: Sync Hugging Face LoRA to Cloudflare AI

on:
  schedule:
    # GitHub Actions cron uses UTC. This runs once every day at 03:15 UTC.
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      hf_repo:
        description: Hugging Face source repository
        required: true
        type: choice
        options:
          - zazo301/ibn-khaldun-fully-merged-model
          - zazo301/brain
        default: zazo301/ibn-khaldun-fully-merged-model
      force_sync:
        description: Re-upload and activate even if this revision was synced before
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-huggingface-cloudflare
  cancel-in-progress: false

env:
  HF_REPO: ${{ inputs.hf_repo || 'zazo301/ibn-khaldun-fully-merged-model' }}
  HF_REVISION: main
  # Supports versioned releases and unversioned adapter files at repository root.
  HF_VERSION_PREFIX: "v-"
  CF_MODEL: "@cf/google/gemma-2b-it-lora"
  CF_ACTIVE_KV_KEY: active-lora
  CF_SOURCE_KV_KEY: huggingface/${{ inputs.hf_repo || 'zazo301/ibn-khaldun-fully-merged-model' }}/revision
  CF_KEEP_RECENT: "5"

jobs:
  sync:
    name: Check and sync LoRA weights
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install jq and validate required secrets
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_KV_TOKEN: ${{ secrets.CF_KV_TOKEN }}
          CF_ACTIVE_CONTEXT_KV_NAMESPACE_ID: ${{ secrets.CF_ACTIVE_CONTEXT_KV_NAMESPACE_ID }}
        run: |
          set -Eeuo pipefail
          command -v curl >/dev/null
          command -v jq >/dev/null
          for name in CF_ACCOUNT_ID CF_AI_TOKEN CF_KV_TOKEN CF_ACTIVE_CONTEXT_KV_NAMESPACE_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

      - name: Check the current Hugging Face revision
        id: hf
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -Eeuo pipefail
          api_url="https://huggingface.co/api/models/${HF_REPO}"
          headers=(-H "User-Agent: zazo-hf-cloudflare-sync")
          if [[ -n "${HF_TOKEN:-}" ]]; then
            headers+=(-H "Authorization: Bearer ${HF_TOKEN}")
          fi

          response="$(curl --fail-with-body --silent --show-error --retry 3 \
            "${headers[@]}" "$api_url")"
          revision="$(jq -r '.sha // empty' <<<"$response")"
          if [[ -z "$revision" ]]; then
            echo "Hugging Face API did not return a repository revision." >&2
            exit 1
          fi

          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Hugging Face revision: $revision"

      - name: Select the newest adapter files
        id: version
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -Eeuo pipefail
          tree_url="https://huggingface.co/api/models/${HF_REPO}/tree/${HF_REVISION}?recursive=true&expand=false"
          headers=(-H "User-Agent: zazo-hf-cloudflare-sync")
          if [[ -n "${HF_TOKEN:-}" ]]; then
            headers+=(-H "Authorization: Bearer ${HF_TOKEN}")
          fi
          tree="$(curl --fail-with-body --silent --show-error --retry 3 "${headers[@]}" "$tree_url")"
          version="$(python3 -c 'import json, re, sys; data=json.load(sys.stdin); prefix=sys.argv[1]; nums=set(); patterns=[re.compile(r"^"+re.escape(prefix)+r"(\d+)-(?:adapter_config|adapter_model)(?: \(1\))?\.(?:json|safetensors)$"), re.compile(r"^"+re.escape(prefix)+r"(\d+)/(?:adapter_config|adapter_model)(?: \(1\))?\.(?:json|safetensors)$"), re.compile(r"^"+re.escape(prefix)+r"(\d+)_(?:adapter_config|adapter_model)(?: \(1\))?\.(?:json|safetensors)$")]; [nums.add(int(m.group(1))) for item in data for pattern in patterns if (m:=pattern.match(item.get("path", "")))]; print(f"{prefix}{max(nums)}" if nums else "")' "$HF_VERSION_PREFIX" <<<"$tree")"
          if [[ -n "$version" ]]; then
            config_path="${version}-adapter_config.json"
            weights_path="${version}-adapter_model.safetensors"
            if ! jq -e --arg p "$config_path" '[.[].path] | index($p)' <<<"$tree" >/dev/null; then config_path="${version}-adapter_config (1).json"; fi
            if ! jq -e --arg p "$weights_path" '[.[].path] | index($p)' <<<"$tree" >/dev/null; then weights_path="${version}-adapter_model (1).safetensors"; fi
            if ! jq -e --arg c "$config_path" --arg w "$weights_path" '[.[].path] | (index($c) != null and index($w) != null)' <<<"$tree" >/dev/null; then
              config_path="${version}/adapter_config.json"
              weights_path="${version}/adapter_model.safetensors"
            fi
          else
            version="latest"
            config_path="adapter_config.json"
            weights_path="adapter_model.safetensors"
          fi
          if ! jq -e --arg c "$config_path" --arg w "$weights_path" '[.[].path] | (index($c) != null and index($w) != null)' <<<"$tree" >/dev/null; then
            echo "${HF_REPO} must contain a matching adapter_config.json and adapter_model.safetensors pair." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "config_path=$config_path" >> "$GITHUB_OUTPUT"
          echo "weights_path=$weights_path" >> "$GITHUB_OUTPUT"
          echo "Selected Hugging Face version: $version"
          echo "Config: $config_path"
          echo "Weights: $weights_path"

      - name: Read the last synchronized revision from Cloudflare KV
        id: state
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_TOKEN: ${{ secrets.CF_KV_TOKEN }}
          CF_ACTIVE_CONTEXT_KV_NAMESPACE_ID: ${{ secrets.CF_ACTIVE_CONTEXT_KV_NAMESPACE_ID }}
        run: |
          set -Eeuo pipefail
          encoded_source_key="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$CF_SOURCE_KV_KEY")"
          kv_url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_ACTIVE_CONTEXT_KV_NAMESPACE_ID}/values/${encoded_source_key}"
          status="$(curl --silent --show-error --output /tmp/last-revision --write-out '%{http_code}' \
            --retry 3 -H "Authorization: Bearer ${CF_KV_TOKEN}" "$kv_url")"

          if [[ "$status" == "404" ]]; then
            last_revision=""
          elif [[ "$status" == "200" ]]; then
            last_revision="$(cat /tmp/last-revision)"
          else
            echo "Cloudflare KV read failed with HTTP $status:" >&2
            cat /tmp/last-revision >&2 || true
            exit 1
          fi

          echo "last_revision=$last_revision" >> "$GITHUB_OUTPUT"
          echo "Last synchronized revision: ${last_revision:-<none>}"

      - name: Stop when Hugging Face has no new revision
        if: inputs.force_sync != true && steps.hf.outputs.revision == steps.state.outputs.last_revision
        shell: bash
        run: echo "No change in Hugging Face; nothing to upload."

      - name: Download and validate the new LoRA files
        if: inputs.force_sync == true || steps.hf.outputs.revision != steps.state.outputs.last_revision
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_CONFIG_PATH: ${{ steps.version.outputs.config_path }}
          HF_WEIGHTS_PATH: ${{ steps.version.outputs.weights_path }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/zazo-lora
          headers=(-H "User-Agent: zazo-hf-cloudflare-sync")
          if [[ -n "${HF_TOKEN:-}" ]]; then
            headers+=(-H "Authorization: Bearer ${HF_TOKEN}")
          fi

          config_url="https://huggingface.co/${HF_REPO}/resolve/${HF_REVISION}/$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["HF_CONFIG_PATH"]))')"
          weights_url="https://huggingface.co/${HF_REPO}/resolve/${HF_REVISION}/$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["HF_WEIGHTS_PATH"]))')"

          curl --fail-with-body --silent --show-error --location --retry 3 \
            "${headers[@]}" "$config_url" -o /tmp/zazo-lora/adapter_config.json
          curl --fail-with-body --silent --show-error --location --retry 3 \
            "${headers[@]}" "$weights_url" -o /tmp/zazo-lora/adapter_model.safetensors

          jq empty /tmp/zazo-lora/adapter_config.json
          # Cloudflare requires model_type=gemma even when the HF adapter config omits it.
          jq '. + {model_type: (.model_type // "gemma")}' \
            /tmp/zazo-lora/adapter_config.json > /tmp/zazo-lora/adapter_config.normalized.json
          mv /tmp/zazo-lora/adapter_config.normalized.json /tmp/zazo-lora/adapter_config.json
          base_model="$(jq -r '.base_model_name_or_path // empty' /tmp/zazo-lora/adapter_config.json)"
          peft_type="$(jq -r '.peft_type // empty' /tmp/zazo-lora/adapter_config.json)"
          rank="$(jq -r '.r // empty' /tmp/zazo-lora/adapter_config.json)"

          if [[ "$base_model" != "google/gemma-2b-it" ]]; then
            echo "Unexpected base model: $base_model" >&2
            exit 1
          fi
          # The v4 adapter uses r=8; v5 uses r=16. Both are supported by
          # the Cloudflare Gemma LoRA path and must be validated explicitly.
          if [[ "$peft_type" != "LORA" || ! "$rank" =~ ^(8|16)$ ]]; then
            echo "Unsupported adapter configuration: peft_type=$peft_type, r=$rank (expected r=8 or r=16)" >&2
            exit 1
          fi

          size_bytes="$(stat -c '%s' /tmp/zazo-lora/adapter_model.safetensors)"
          if (( size_bytes < 1 )); then
            echo "The downloaded adapter weights are empty." >&2
            exit 1
          fi
          # Keep a safety margin below Cloudflare's documented fine-tune asset limit.
          if (( size_bytes >= 300000000 )); then
            echo "The adapter is too large for the configured Cloudflare limit: ${size_bytes} bytes" >&2
            exit 1
          fi

          echo "Downloaded adapter: $((size_bytes / 1024 / 1024)) MiB"
          sha256sum /tmp/zazo-lora/adapter_config.json /tmp/zazo-lora/adapter_model.safetensors

      - name: Create a new Cloudflare fine-tune
        if: inputs.force_sync == true || steps.hf.outputs.revision != steps.state.outputs.last_revision
        id: fine_tune
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          HF_REVISION_OUTPUT: ${{ steps.hf.outputs.revision }}
          HF_VERSION_OUTPUT: ${{ steps.version.outputs.version }}
        run: |
          set -Eeuo pipefail
          cf_api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai"
          safe_revision="${HF_REVISION_OUTPUT:0:12}"
          run_name="zazo-hf-${safe_revision}-$(date -u +%Y%m%d)"
          description="Zazo LoRA ${HF_VERSION_OUTPUT} synced from Hugging Face ${HF_REPO}@${HF_REVISION_OUTPUT}"

          payload="$(jq -n \
            --arg model "$CF_MODEL" \
            --arg name "$run_name" \
            --arg description "$description" \
            '{model:$model,name:$name,description:$description}')"

          http_status="$(curl --silent --show-error --retry 3 \
            --output /tmp/cloudflare-finetune-response.json \
            --write-out '%{http_code}' \
            -X POST "$cf_api/finetunes" \
            -H "Authorization: Bearer ${CF_AI_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          response="$(cat /tmp/cloudflare-finetune-response.json)"
          fine_tune_id="$(jq -r '.result.id // empty' <<<"$response")"
          if [[ "$http_status" != 2* ]] || [[ "$(jq -r '.success // false' <<<"$response")" != "true" ]]; then
            if grep -q 'FINETUNE_EXISTS_ERROR' <<<"$response"; then
              echo "Fine-tune ${run_name} already exists; looking it up and reusing it."
              existing="$(curl --fail-with-body --silent --show-error --retry 3 \
                -H "Authorization: Bearer ${CF_AI_TOKEN}" \
                "$cf_api/finetunes")"
              fine_tune_id="$(jq -r --arg name "$run_name" '.result | flatten | .[] | select(.name == $name) | .id' <<<"$existing" | head -n 1)"
            else
              echo "Cloudflare fine-tune creation failed (HTTP ${http_status})." >&2
              echo "$response" >&2
              if [[ "$http_status" == "403" ]]; then
                echo "Fix CF_AI_TOKEN: create a Cloudflare Workers AI API Token with Workers AI Write/Edit permission for this account." >&2
              fi
              exit 1
            fi
          fi
          if [[ -z "$fine_tune_id" ]]; then
            echo "Cloudflare did not return or expose a fine-tune id:" >&2
            echo "$response" >&2
            exit 1
          fi

          echo "id=$fine_tune_id" >> "$GITHUB_OUTPUT"
          echo "name=$run_name" >> "$GITHUB_OUTPUT"
          echo "Created fine-tune: $fine_tune_id"

      - name: Upload adapter config and weights to Cloudflare
        if: inputs.force_sync == true || steps.hf.outputs.revision != steps.state.outputs.last_revision
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          FINE_TUNE_NAME: ${{ steps.fine_tune.outputs.name }}
        run: |
          set -Eeuo pipefail
          encoded_finetune_name="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$FINE_TUNE_NAME")"
          asset_url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/finetunes/${encoded_finetune_name}/finetune-assets"

          upload_asset() {
            local file_name="$1"
            local file_path="$2"
            local response_file="/tmp/cloudflare-${file_name}.response.json"
            local http_status
            local response
            for attempt in $(seq 1 12); do
              http_status="$(curl --silent --show-error --retry 2 \
                --output "$response_file" \
                --write-out '%{http_code}' \
                -X POST "$asset_url" \
                -H "Authorization: Bearer ${CF_AI_TOKEN}" \
                -F "file_name=${file_name}" \
                -F "file=@${file_path};filename=${file_name};type=application/octet-stream")"
              response="$(cat "$response_file")"
              if [[ "$http_status" == 2* ]] && [[ "$(jq -r '.success // false' <<<"$response")" == "true" ]]; then
                echo "Uploaded ${file_name}."
                return 0
              fi
              if [[ "$http_status" == "404" && "$attempt" -lt 12 ]]; then
                echo "Cloudflare has not finished provisioning the fine-tune; retrying ${file_name} in 5 seconds (attempt ${attempt}/12)."
                sleep 5
                continue
              fi
              echo "Cloudflare rejected ${file_name} (HTTP ${http_status}):" >&2
              echo "$response" >&2
              exit 1
            done
          }

          upload_asset adapter_model.safetensors /tmp/zazo-lora/adapter_model.safetensors
          upload_asset adapter_config.json /tmp/zazo-lora/adapter_config.json
          echo "Both LoRA assets uploaded successfully."

      - name: Activate the new adapter in Cloudflare KV
        if: inputs.force_sync == true || steps.hf.outputs.revision != steps.state.outputs.last_revision
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_TOKEN: ${{ secrets.CF_KV_TOKEN }}
          CF_ACTIVE_CONTEXT_KV_NAMESPACE_ID: ${{ secrets.CF_ACTIVE_CONTEXT_KV_NAMESPACE_ID }}
          FINE_TUNE_ID: ${{ steps.fine_tune.outputs.id }}
          FINE_TUNE_NAME: ${{ steps.fine_tune.outputs.name }}
          HF_REVISION_OUTPUT: ${{ steps.hf.outputs.revision }}
        run: |
          set -Eeuo pipefail
          kv_base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_ACTIVE_CONTEXT_KV_NAMESPACE_ID}/values"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          active_pointer="$(jq -n \
            --arg id "$FINE_TUNE_ID" \
            --arg name "$FINE_TUNE_NAME" \
            --arg model "$CF_MODEL" \
            --arg repo "$HF_REPO" \
            --arg revision "$HF_REVISION_OUTPUT" \
            --arg updated "$now" \
            '{id:$id,name:$name,model:$model,sourceRepo:$repo,sourceRevision:$revision,updatedAt:$updated}')"

          put_kv() {
            local key="$1"
            local value="$2"
            local response
            response="$(curl --fail-with-body --silent --show-error --retry 3 \
              -X PUT "$kv_base/$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$key")" \
              -H "Authorization: Bearer ${CF_KV_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$value")"
            if [[ "$(jq -r '.success // false' <<<"$response")" != "true" ]]; then
              echo "Cloudflare KV write failed for ${key}:" >&2
              echo "$response" >&2
              exit 1
            fi
          }

          # Only activate after both Cloudflare assets were accepted.
          put_kv "$CF_ACTIVE_KV_KEY" "$active_pointer"
          put_kv "$CF_SOURCE_KV_KEY" "$HF_REVISION_OUTPUT"
          echo "Activated fine-tune ${FINE_TUNE_ID} for Hugging Face revision ${HF_REVISION_OUTPUT}."
