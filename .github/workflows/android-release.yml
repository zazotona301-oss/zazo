name: Android release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to build, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and attach Android assets to GitHub Release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.ref }}

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}"
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Use a semantic version tag such as v1.2.3." >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if (( MINOR > 999 || PATCH > 999 || MAJOR > 2146 )); then
            echo "Version components exceed the supported Android versionCode range." >&2
            exit 1
          fi
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH + 1))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Verify signing secrets and restore keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          KEYSTORE_FILE="$RUNNER_TEMP/zazo-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://zazo-brain-backend.zazotona301.workers.dev' }}
          ZAZO_WEB_UI_URL: ${{ vars.ZAZO_WEB_UI_URL || 'https://zazo-brain-ui.pages.dev' }}
          VITE_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.VITE_GOOGLE_DRIVE_CLIENT_ID || secrets.VITE_GOOGLE_DRIVE_CLIENT_ID }}
          VITE_GOOGLE_DRIVE_FOLDER_ID: ${{ vars.VITE_GOOGLE_DRIVE_FOLDER_ID || secrets.VITE_GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          chmod +x android/gradlew
          ./android/gradlew --no-daemon -p android \
            assembleRelease bundleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"
          mkdir -p android/app/build/outputs/release-assets
          cp android/app/build/outputs/apk/release/app-release.apk \
            "android/app/build/outputs/release-assets/zazo-v${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "android/app/build/outputs/release-assets/zazo-v${{ steps.version.outputs.name }}.aab"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            "android/app/build/outputs/release-assets/zazo-v${{ steps.version.outputs.name }}.apk"
          jarsigner -verify \
            "android/app/build/outputs/release-assets/zazo-v${{ steps.version.outputs.name }}.aab" >/dev/null
          cd android/app/build/outputs/release-assets
          sha256sum ./*.apk ./*.aab > SHA256SUMS.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/release-assets/*.apk
            android/app/build/outputs/release-assets/*.aab
            android/app/build/outputs/release-assets/SHA256SUMS.txt

      - name: Generate GitHub Pages release catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-release-site.mjs

      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pages")"
          if [[ "$status" == "200" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "404" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled yet. Enable Settings → Pages → Build and deployment → Source: GitHub Actions; release assets were still published."
            echo "GitHub Pages deployment skipped. Enable Pages in repository settings, then rerun this workflow to publish the catalog." >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$response_file" >&2
            echo "GitHub Pages API check returned HTTP $status." >&2
            exit 1
          fi
          rm -f "$response_file"

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
